name: Deploy TaskFlow API

on:
  workflow_run:
    workflows: ["API CI"]
    types: [completed]

concurrency:
  group: taskflow-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: Production
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" || { echo "Missing Production secret: EC2_HOST" >&2; exit 1; }
          test -n "$EC2_USER" || { echo "Missing Production secret: EC2_USER" >&2; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "Missing Production secret: EC2_SSH_KEY" >&2; exit 1; }

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/taskflow.pem
          chmod 600 ~/.ssh/taskflow.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy API on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/taskflow.pem "$EC2_USER@$EC2_HOST" '
            set -eu
            cd ~/task-management
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x deploy/ec2/deploy.sh
            ./deploy/ec2/deploy.sh
          '
